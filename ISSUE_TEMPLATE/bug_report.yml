name: Bug report
description: Report a reproducible problem. Report vulnerabilities privately.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials or personal data. Use the Security tab for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime, and relevant sanitized logs.
